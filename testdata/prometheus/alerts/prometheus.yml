---
groups:
  - name: Prometheus
    rules:
      - alert: PrometheusDiscoveryHighRequestRate
        # this expression is NOT a proper solution to detect request spikes.
        # it simply serves as an easy trigger for alerts:
        # visit an endpoint in the Prometheus Web UI to trigger the alert
        # (e.g. /service-discovery); refresh the page to cause the alert
        # to resolve
        expr: >-
          prometheus_http_requests_total{handler=~".+-discovery"} % 2 == 1
        for: 0m
        labels:
          severity: warning
          icinga_use_host: prometheus.localhost
        annotations:
          message: High request volume on Prometheus discovery endpoint {{ $labels.handler }}
          description: >-
            Requests against the discovery endpoint {{ $labels.handler }}
            are higher than the expected average.
          runbook_url: https://runbooks.example.com/prometheus/{{ $labels.alertname }}
  - name: Alertmanager
    rules:
      - alert: AlertmanagerUp
        # this expression does not represent an actual availability check
        # it simply serves as an easy trigger for alerts:
        # visit the status endpoint in the Alertmanager Web UI to trigger the alert
        # (/#/status); refresh the page to cause the alert to resolve
        expr: >-
          alertmanager_http_request_duration_seconds_count{handler="/api/v2/status"} % 2 == 1
        for: 0m
        labels:
          severity: critical
          icinga_use_host: alertmanager.localhost
          icinga_use_host_check: "true"
        annotations:
          message: Status endpoint {{ $labels.handler }} is in a degraded state
          description: >-
            Health information from the API endpoint {{ $labels.handler }} suggest
            the application is not working properly.
          runbook_url: https://runbooks.example.com/alertmanager/{{ $labels.alertname }}
