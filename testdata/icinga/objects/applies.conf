apply Service "heartbeat" to Host {
  import "generic-service"

  display_name = "External connectivity"

  check_interval = 2m
  check_command = "dummy"

  vars.dummy_state = 2
  vars.dummy_text = {{
    var service = get_service(macro("$host.name$"), macro("$service.name$"))
    var lastCheck = DateTime(service.last_check).to_string()

    return "No check results received. Last result time: " + lastCheck
  }}

  assign where "alertmanager-icinga-bridge" in host.vars.applications
}
